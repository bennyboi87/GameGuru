<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Guru - Drink Token Manager</title>
  <style>
    :root {
      --bg-color: #12161A;
      --card-bg: #1C232B;
      --accent-orange: #D95D39;
      --text-color: #F0F4F8;
      --success-green: #2E7D32;
      --error-red: #C62828;
      --border-color: #2C3540;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; max-width: 500px; margin: 0 auto; }

    header { text-align: center; padding: 12px 0 20px; border-bottom: 2px solid var(--accent-orange); margin-bottom: 16px; }
    header h1 { font-size: 1.5rem; color: var(--accent-orange); text-transform: uppercase; letter-spacing: 1px; }
    header p { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }

    /* Nav Tabs */
    nav { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px 6px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent-orange); border-color: var(--accent-orange); color: #fff; }

    /* Views */
    .view { display: none; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
    .view.active { display: block; }

    h2 { font-size: 1.2rem; margin-bottom: 14px; border-left: 4px solid var(--accent-orange); padding-left: 8px; }

    /* Inputs & Buttons */
    label { font-size: 0.85rem; opacity: 0.9; display: block; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 12px; background: #0E1216; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 1.1rem; margin-bottom: 16px; text-transform: uppercase; font-weight: bold; }

    .action-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
    .primary-btn { background: var(--accent-orange); color: white; }
    .success-btn { background: var(--success-green); color: white; }
    .cancel-btn { background: #455A64; color: white; }

    /* Result Banners */
    .status-card { margin-top: 16px; padding: 16px; border-radius: 8px; text-align: center; font-weight: bold; display: none; }
    .status-card.valid { background: #1B5E20; color: #E8F5E9; border: 2px solid #4CAF50; display: block; }
    .status-card.invalid { background: #B71C1C; color: #FFEBEE; border: 2px solid #EF5350; display: block; }
    .status-card.info { background: #0D47A1; color: #E3F2FD; border: 2px solid #2196F3; display: block; }

    .counter { font-size: 0.85rem; text-align: center; margin-top: 12px; opacity: 0.7; }
  </style>
</head>
<body>

  <header>
    <h1>Game Guru TCG</h1>
    <p>Drink Token Manager PWA</p>
  </header>

  <nav>
    <button class="tab-btn active" onclick="switchTab('program')">1. Program</button>
    <button class="tab-btn" onclick="switchTab('redeem')">2. Redeem & Wipe</button>
    <button class="tab-btn" onclick="switchTab('inspect')">3. Inspect</button>
  </nav>

  <!-- SCREEN 1: PROGRAM KEYWORD -->
  <div id="view-program" class="view active">
    <h2>Manager Setup</h2>
    <label for="keyword-input">Tonight's Secret Keyword:</label>
    <input type="text" id="keyword-input" value="MANA" placeholder="e.g. MANA">

    <button class="action-btn primary-btn" onclick="startProgramming()">⚡ Tap to Program Token</button>
    
    <div id="program-status" class="status-card"></div>
  </div>

  <!-- SCREEN 2: BAR REDEEM & WIPE -->
  <div id="view-redeem" class="view">
    <h2>Bar Redemption</h2>
    <p style="font-size:0.85rem; margin-bottom:12px;">Active Night Key: <strong id="active-key-display" style="color:var(--accent-orange);">MANA</strong></p>

    <button class="action-btn primary-btn" onclick="startRedeemScan()">🍺 Scan Customer Token</button>

    <div id="redeem-result" class="status-card"></div>

    <div id="redeem-actions" style="display:none; margin-top:16px;">
      <button class="action-btn success-btn" onclick="confirmWipe()">🟢 REDEEM & WIPE TOKEN</button>
      <button class="action-btn cancel-btn" onclick="resetRedeemView()">⚪ CANCEL / RETURN TOKEN</button>
    </div>

    <div class="counter">Tonight's Redemptions: <span id="redeem-count">0</span></div>
  </div>

  <!-- SCREEN 3: QUICK INSPECT -->
  <div id="view-inspect" class="view">
    <h2>Diagnostic Inspect</h2>
    <p style="font-size:0.85rem; margin-bottom:12px;">Read token content without wiping or modifying.</p>

    <button class="action-btn primary-btn" onclick="startInspectScan()">🔍 Scan Token Info</button>

    <div id="inspect-status" class="status-card"></div>
  </div>

  <script>
    let activeNFCReader = null;
    let currentScannedRecord = "";
    let currentSerial = "";
    let redemptionCounter = 0;

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      
      if(tab === 'program') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('view-program').classList.add('active');
      } else if(tab === 'redeem') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('view-redeem').classList.add('active');
        document.getElementById('active-key-display').innerText = document.getElementById('keyword-input').value.toUpperCase();
      } else if(tab === 'inspect') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('view-inspect').classList.add('active');
      }
    }

    // --- SCREEN 1: PROGRAMMING ---
    async function startProgramming() {
      const keyword = document.getElementById('keyword-input').value.trim().toUpperCase();
      const statusBox = document.getElementById('program-status');

      if (!keyword) { alert("Please enter a keyword first!"); return; }
      if (!('NDEFReader' in window)) { alert("Web NFC is not supported on this browser/device."); return; }

      statusBox.className = "status-card info";
      statusBox.innerText = `Ready! Tap blank token to write: "${keyword}"...`;

      try {
        const ndef = new NDEFReader();
        await ndef.write({
          records: [{ recordType: "text", data: keyword }]
        });
        statusBox.className = "status-card valid";
        statusBox.innerText = `✅ Success! Token encoded with "${keyword}"`;
      } catch (error) {
        statusBox.className = "status-card invalid";
        statusBox.innerText = `❌ Error writing token: ${error.message}`;
      }
    }

    // --- SCREEN 2: REDEEM & WIPE ---
    async function startRedeemScan() {
      const activeKeyword = document.getElementById('keyword-input').value.trim().toUpperCase();
      const resultBox = document.getElementById('redeem-result');
      const actionBox = document.getElementById('redeem-actions');

      resultBox.className = "status-card info";
      resultBox.innerText = "Approach token to scan...";
      actionBox.style.display = "none";

      if (!('NDEFReader' in window)) { alert("Web NFC is not supported on this device."); return; }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        
        ndef.onreading = event => {
          const decoder = new TextDecoder();
          currentSerial = event.serialNumber;
          currentScannedRecord = "";

          for (const record of event.message.records) {
            if (record.recordType === "text") {
              currentScannedRecord = decoder.decode(record.data).toUpperCase();
            }
          }

          // Strip NDEF language codes if present (e.g. "ENMANA" -> "MANA")
          if (currentScannedRecord.length > 2 && currentScannedRecord.startsWith("EN")) {
            currentScannedRecord = currentScannedRecord.substring(2);
          }

          if (currentScannedRecord === activeKeyword) {
            resultBox.className = "status-card valid";
            resultBox.innerHTML = `🟢 <strong>VALID DRINK TOKEN</strong><br><small>Key: ${currentScannedRecord}</small>`;
            actionBox.style.display = "block";
          } else if (currentScannedRecord === "REDEEMED") {
            resultBox.className = "status-card invalid";
            resultBox.innerHTML = `🔴 <strong>ALREADY REDEEMED</strong><br><small>This token was already wiped!</small>`;
          } else {
            resultBox.className = "status-card invalid";
            resultBox.innerHTML = `🔴 <strong>INVALID / EXPIRED TOKEN</strong><br><small>Scanned: "${currentScannedRecord || 'EMPTY'}"</small>`;
          }
        };
      } catch (error) {
        resultBox.className = "status-card invalid";
        resultBox.innerText = `Scan Error: ${error.message}`;
      }
    }

    async function confirmWipe() {
      const resultBox = document.getElementById('redeem-result');
      const actionBox = document.getElementById('redeem-actions');

      try {
        const ndef = new NDEFReader();
        await ndef.write({
          records: [{ recordType: "text", data: "REDEEMED" }]
        });

        redemptionCounter++;
        document.getElementById('redeem-count').innerText = redemptionCounter;

        resultBox.className = "status-card valid";
        resultBox.innerHTML = `✅ <strong>TOKEN REDEEMED & WIPED!</strong><br><small>Serve customer drink.</small>`;
        actionBox.style.display = "none";
      } catch (error) {
        alert("Failed to wipe token: " + error.message);
      }
    }

    function resetRedeemView() {
      document.getElementById('redeem-result').style.display = "none";
      document.getElementById('redeem-actions').style.display = "none";
    }

    // --- SCREEN 3: INSPECT ---
    async function startInspectScan() {
      const statusBox = document.getElementById('inspect-status');
      statusBox.className = "status-card info";
      statusBox.innerText = "Tap token to inspect payload...";

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        ndef.onreading = event => {
          const decoder = new TextDecoder();
          let text = "";
          for (const record of event.message.records) {
            text += decoder.decode(record.data) + " ";
          }
          statusBox.className = "status-card valid";
          statusBox.innerHTML = `<strong>Raw Content:</strong> "${text.trim()}"<br><small>Tag Serial: ${event.serialNumber}</small>`;
        };
      } catch (error) {
        statusBox.className = "status-card invalid";
        statusBox.innerText = `Inspect Error: ${error.message}`;
      }
    }
  </script>
</body>
</html>
